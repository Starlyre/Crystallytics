<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystallytics 💎 | Intro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient glow backdrop */
        .glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(99, 102, 241, 0.1) 40%, transparent 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: pulse 4s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.7; }
            100% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 900px;
            padding: 2rem;
        }

        .diamond-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 88px;
            height: 88px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.03));
            border: 1px solid rgba(56, 189, 248, 0.4);
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.35);
            font-size: 3rem;
            margin-bottom: 1.5rem;
            animation: float 3s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        h1 {
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 20%, #38bdf8 60%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.8rem;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 1.5rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 1.2rem;
        }

        .tagline {
            font-size: 1.1rem;
            color: #38bdf8;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 2.2rem;
            letter-spacing: 0.02em;
        }

        .badges {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2.5rem;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.55rem 1.1rem;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #e2e8f0;
            backdrop-filter: blur(10px);
        }

        .pill.accent {
            border-color: rgba(56, 189, 248, 0.6);
            color: #38bdf8;
            background: rgba(14, 165, 233, 0.12);
        }

        .loader-bar {
            width: 280px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            margin: 0 auto 0.8rem;
            overflow: hidden;
            position: relative;
        }

        .loader-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            border-radius: 999px;
            animation: fill 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fill {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .loading-text {
            font-size: 0.85rem;
            color: #64748b;
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="container">
        <div class="diamond-badge">💎</div>
        <h1>Crystallytics</h1>
        <div class="subtitle">AI-Powered, Context-Aware Automated Analytics</div>
        <div class="tagline">&lt; Crystallize your data • Tally the truth /&gt;</div>
        
        <div class="badges">
            <span class="pill accent">⚡ Google Antigravity</span>
            <span class="pill">📊 Automated Chart Recommender</span>
            <span class="pill">🧠 Zero-Hallucination AI</span>
            <span class="pill">🧹 1-Click Data Cleaning</span>
            <span class="pill">🛡️ ISO/IEC 25010 & 27001</span>
        </div>

        <div class="loader-bar">
            <div class="loader-fill"></div>
        </div>
        <div class="loading-text">LAUNCHING INTERACTIVE DEMO...</div>
    </div>
</body>
</html>
